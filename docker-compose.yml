version: '3.8'

services:
  pkt-store:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pkt-store
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.production  # This file will be created by setup-env.sh on your server
    networks:
      - pkt-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  pkt-network:
    driver: bridge
